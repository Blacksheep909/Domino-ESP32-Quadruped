; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  bblanchon/ArduinoJson@^7.4.2

; Domino PCB V1.1B routes its SpotMicro-style 0-25 V divider module to
; SENSOR_VP / GPIO36. Ratio 5000 means a nominal 5:1 divider. Adjust the PPM
; multiplier only after comparing LIVE against a trusted multimeter.
build_flags =
  -DDOMINO_VOLTAGE_MONITOR_ENABLED=1
  -DDOMINO_VOLTAGE_ADC_PIN=36
  -DDOMINO_VOLTAGE_DIVIDER_RATIO_MILLI=5000
  -DDOMINO_VOLTAGE_CALIBRATION_PPM=1000000

; Optional physical power telemetry. Leave disabled until an INA226 and an
; appropriately rated external shunt are installed and independently checked.
; Uncomment and replace these values with the measured hardware values:
; Add these entries to build_flags above when INA226 hardware is installed:
;   -DDOMINO_POWER_MONITOR_ENABLED=1
;   -DDOMINO_POWER_MONITOR_ADDRESS=0x40
;   -DDOMINO_POWER_SHUNT_MICRO_OHMS=2000
;   -DDOMINO_POWER_MAX_CURRENT_MILLIAMPS=30000
;   -DDOMINO_POWER_CRITICAL_VOLTAGE_MV=12800
;   -DDOMINO_POWER_FAULT_RECOVERY_VOLTAGE_MV=13600
